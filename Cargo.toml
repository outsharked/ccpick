[package]
name = "ccpick"
version = "0.1.0"
edition = "2024"
description = "Fast TUI to find and resume Claude Code sessions across config directories"
repository = "https://github.com/outsharked/ccpick"
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
dunce = "1.0.5"
memchr = "2.8.3"
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_yaml = "0.9.34"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }
